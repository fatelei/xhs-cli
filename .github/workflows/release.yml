name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            filename: xhs-linux-x64
          - os: macos-15-intel
            target: macos-x64
            filename: xhs-macos-x64
          - os: macos-latest
            target: macos-arm64
            filename: xhs-macos-arm64
          - os: windows-latest
            target: win-x64
            filename: xhs-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create output directory
        run: mkdir dist

      - name: Build executable
        run: >-
          npx --yes @yao-pkg/pkg@6.21.0
          --target node22-${{ matrix.target }}
          --no-bytecode --public-packages "*" --public
          --output dist/${{ matrix.filename }} bin/xhs.js

      - name: Check executable
        run: dist/${{ matrix.filename }} --help
        if: runner.os != 'Windows'

      - name: Check executable (Windows)
        run: '& "dist/${{ matrix.filename }}" --help'
        if: runner.os == 'Windows'

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
